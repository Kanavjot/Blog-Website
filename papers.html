<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Marginalia — Papers</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
        <link rel = "stylesheet" href="css/styles.css">

    </head>

    <body>
        <div class = "page">
            <header class="site-header">
                <div class="site-header__inner">
                        <a href="index.html" class="site-mark">Marginalia <small>/ papers</small></a>
                        <nav class = "site-nav">
                            <a href="index.html">Home</a>
                            <a href="papers.html">Papers</a>
                            <a href="updates.html">Updates</a>
                            <a href="login.html">Admin</a>
                            <a href="about.html">About</a>
                        </nav>
                </div>
            </header>    
        
    

        <section class="hero">
            <div class="hero__inner">
                <h1 style="border-right: 2px solid #ccc;border-left: 2px solid #ccc; padding-right: 10px; margin-right: 10px;"class="hero__inner">Research Notebook</h1>
            </div>
        </section>

        <main style = "grid-template-columns: 1fr; max-width: 56rem;">
            <article class = "post-main">
                <input type="text" id="search-input" class = "search-box" placeholder="Search papers...">
                
                <div class = "filters">
                    <span class = "filters-label">Topic:</span>
                    <button class = "pill active" data-filter-type = "tag" data-value = "all">All</button>
                    <button class = "pill" data-filter-type = "tag" data-value = "ml">ML</button>
                    <button class = "pill" data-filter-type = "tag" data-value = "physics">Physics</button>
                    <button class = "pill" data-filter-type = "tag" data-value = "biotech">Biotech</button>
                </div>

                <div class = "filters">
                    <span class = "filters-label">Difficulty:</span>
                    <button class = "pill active" data-filter-type = "difficulty" data-value="all">All</button>
                    <button class = "pill" data-filter-type = "difficulty" data-value="beginner">Beginner</button>
                    <button class = "pill" data-filter-type = "difficulty" data-value="intermediate">Intermediate</button>
                    <button class = "pill" data-filter-type = "difficulty" data-value="advanced">Advanced</button>
                </div>

                <ul class = "paper-list" id = "papersList">
                    
                </ul>
                <p id = "no-results" class = "no-results" hidden>No papers found matching your search criteria.</p>

            </article>
        </main>

        <footer class="site-footer">
            <div class="wrap">Marginalia | Reading between the margins</div>
        </footer>
    </div>
    <script defer src = "js/papers.js"></script>
    </body>
</html>
