<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Marginalia -- Your Dashboard</title>
        <link rel="icon" href="/favicon.ico">
        <link rel = "stylesheet" href = "css/styles.css">
        <script src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    </head>
    <body>
        <div class = "page">
            <div id = "site-header"></div>
            <main class = "dash">
                <div class = "dash-head">
                    <div>
                    <h1 id = "user-name">Loading...</h1>
                    <span class = "role-badge">Reader</span>
                    </div>
                    <button id = "logout-btn" class = "remove-btn">Log Out</button>
                </div>

                <div class = "stats-row">
                    <div class = "stat-box"><strong id = "stat-saved">0</strong><span>Saved Papers</span></div>
                    <div class = "stat-box"><strong id = "stat-notes">0</strong><span>Notes</span></div>
                </div>

                <div class = "tabs">
                    <button class = "tab-btn active" data-tab="library">Library</button>
                    <button class = "tab-btn" data-tab="desk">My Desk</button>
                    <button class = "tab-btn" data-tab="notes">Notes</button>
                </div>

                <section class = "tab-panel active" id = "tab-library">
                    <div id = "library-list"><p>Loading...</p></div>
                </section>

                <section class = "tab-panel" id = "tab-desk">
                    <p style = "color: var(--ink-soft) ; font-size: 0.8rem">Choose your favorite topics</p>
                    <div id = "topic-toggles"></div>
                </section>

                <section class = "tab-panel" id = "tab-notes">
                    <form id = "note-form" class = "note-form" style="margin-bottom:1.2rem;">
                        <textarea id="note-content" placeholder="Write a note..."></textarea>
                        <button type = "submit" class="bookmark-btn">Save Note</button>
                    </form>
                    <div id = "notes-list"></div>
                </section>

            </main>
            <footer class = "site-footer"><div class = "wrap">Marginalia | Reading between the margins</div></footer>
        </div>
        <script src = "js/supabase-client.js"></script>
        <script src = "js/nav.js"></script>
        <script defer src = "js/main.js"></script>
        <script src = "js/dashboard.js"></script>
    </body>
</html>
