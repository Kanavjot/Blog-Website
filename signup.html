<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Marginalia - Sign Up</title>
        <link rel = "stylesheet" href = "css/styles.css">
        <script src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    </head>
    <body>
        <div id = "site-header"></div>
        <div class = "auth-body">
            <form id = "signup-form" class = "auth-form">
                <h1> Create an Account</h1>
                <input type = "text" id = "name" placeholder = "Display Name" required class="auth-input">
                <input type = "email" id = "email" placeholder = "Email" required class = "auth-input">
                <input type = "password" id = "password" placeholder="Password(min 6 characters)" required minlength="6" class = "auth-input">
                <button type = "submit" class = "auth-btn">Sign Up</button>
                <p id = "message" class = "auth-msg"></p>
                <p class = "auth-footer"><a href = "reader-login.html">Already have an Account? Log In</a></p>
            </form>
        </div>
        <script src = "js/supabase-client.js"></script>
        <script src = "js/nav.js"></script>
        <script src = "js/main.js"></script>
        <script src = "js/signup.js"></script>
    </body>
</html>
